<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky simulator bar on top (scenario picker) + six tabs (pipeline + five roles) sharing one state */
:root{
  --bg:#f4f7f6; --surface:#ffffff; --fg:#14211f; --mute:#58696a; --line:#d8e2e0;
  --accent:#0d6b63; --accent-soft:#dcefec; --accent-fg:#ffffff;
  --ok:#1f7a4a; --ok-soft:#dff2e6; --notice:#2d5da1; --notice-soft:#e2ebf8;
  --warn:#9a5b00; --warn-soft:#fbecd0; --crit:#b3261e; --crit-soft:#fbe0dd;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1514; --surface:#162120; --fg:#e6efed; --mute:#9bb0ae; --line:#2a3b39;
  --accent:#5cc7bb; --accent-soft:#1b3a37; --accent-fg:#06201d;
  --ok:#6ad39a; --ok-soft:#183626; --notice:#8fb5ee; --notice-soft:#1b2a40;
  --warn:#f0b960; --warn-soft:#3b2d12; --crit:#ff8d84; --crit-soft:#431d1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1514; --surface:#162120; --fg:#e6efed; --mute:#9bb0ae; --line:#2a3b39;
  --accent:#5cc7bb; --accent-soft:#1b3a37; --accent-fg:#06201d;
  --ok:#6ad39a; --ok-soft:#183626; --notice:#8fb5ee; --notice-soft:#1b2a40;
  --warn:#f0b960; --warn-soft:#3b2d12; --crit:#ff8d84; --crit-soft:#431d1a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.6;
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3,h4{margin:0;line-height:1.3;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}

header.top{padding-block:20px 12px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;justify-content:space-between}
header.top h1{font-size:22px;font-weight:900;letter-spacing:.02em}
header.top p{margin:0;color:var(--mute);font-size:13px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:1px 8px;font-size:12px;color:var(--mute);background:var(--surface)}

.sim{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:10px}
.sim h2{font-size:13px;color:var(--mute);font-weight:500;letter-spacing:.06em}
.scn{display:flex;flex-wrap:wrap;gap:8px}
.scn button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 12px;text-align:left;min-height:44px}
.scn button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.scn b{display:block;font-size:14px}
.scn span{font-size:12px;color:var(--mute)}
.simnote{font-size:13px;color:var(--mute);margin:0}

nav.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:16px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;white-space:nowrap;font-weight:500;color:var(--mute);min-height:44px}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:700}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--crit);color:#fff;font-size:12px;line-height:20px;text-align:center}

main{margin-top:20px;display:grid;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card h3{font-size:16px;margin-bottom:10px}
.card h4{font-size:14px;margin-bottom:6px}
.lead{font-size:13px;color:var(--mute);margin:0 0 10px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--mute);font-size:12px}
td.r,th.r{text-align:right}
tr.today td{background:var(--accent-soft)}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.notice{background:var(--notice-soft);color:var(--notice)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.na{background:var(--bg);color:var(--mute);border:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;min-height:40px;font-weight:500}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;font-size:13px;min-height:34px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
textarea,input[type=number]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input[type=number]{width:86px}

/* pipeline */
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:8px}
.flow button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;position:relative}
.flow button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.flow b{display:block;font-size:14px} .flow span{font-size:12px;color:var(--mute)}
.flow button.pulse{animation:pulse .5s ease both}
@keyframes pulse{from{background:var(--accent-soft);transform:translateY(2px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.flow button.pulse{animation:none}}
pre.raw{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-family:var(--mono);font-size:12px;overflow-x:auto;line-height:1.5}
ul.plain{margin:0;padding-left:18px;display:grid;gap:4px}

/* charts */
svg.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .tick{fill:var(--mute);font-size:11px;font-family:var(--font)}
.chart .ln{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .c-a{stroke:var(--accent)} .chart .c-b{stroke:var(--notice)} .chart .c-w{stroke:var(--warn)} .chart .c-r{stroke:var(--crit)}
.chart .band{fill:var(--accent-soft)} .chart .thr{stroke:var(--crit);stroke-dasharray:5 4;stroke-width:1.5}
.chart .thrt{fill:var(--crit);font-size:11px}
.chart .bar{fill:var(--accent)} .chart .bar.today{fill:var(--notice)}
.chart .dot{fill:var(--surface);stroke-width:2.2}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:4px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* elder phone */
.phone{max-width:420px;margin:0 auto;border:1px solid var(--line);border-radius:28px;background:var(--surface);padding:22px 18px 24px;display:grid;gap:14px;width:100%}
.phone .hello{font-size:22px;font-weight:700}
.q{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--bg)}
.q h3{font-size:18px;color:var(--mute);font-weight:500;margin-bottom:4px}
.q .big{font-size:34px;font-weight:900;line-height:1.2}
.q p{margin:6px 0 0;font-size:20px;line-height:1.5}
.stars{font-size:30px;letter-spacing:4px;color:var(--warn)}
.gauge{display:flex;gap:6px;margin-top:8px;align-items:center;font-size:18px}
.gauge i{width:34px;height:12px;border-radius:6px;background:var(--line)} .gauge i.on{background:var(--accent)}
.bigbtn{width:100%;min-height:60px;font-size:20px;font-weight:700;border-radius:14px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-fg);margin-top:10px;padding:10px}
.helpbtn{width:100%;min-height:60px;font-size:20px;font-weight:700;border-radius:14px;border:2px solid var(--crit);background:var(--surface);color:var(--crit);padding:10px}
.msg{font-size:18px;background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:10px 14px}
.state-ok{background:var(--ok-soft)} .state-warn{background:var(--warn-soft)} .state-crit{background:var(--crit-soft)}

/* family */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week div{border:1px solid var(--line);border-radius:10px;padding:8px 2px;font-size:12px;background:var(--bg)}
.week div.on{background:var(--accent-soft);border-color:var(--accent)}
.week b{display:block;font-size:18px}
.meter{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin:4px 0 2px}
.meter i{display:block;height:100%;background:var(--accent)}
.status-line{font-size:20px;font-weight:700}

/* alerts */
.alert{border:1px solid var(--line);border-left-width:6px;border-radius:8px;padding:12px;display:grid;gap:8px;background:var(--surface)}
.alert.crit{border-left-color:var(--crit)} .alert.warn{border-left-color:var(--warn)} .alert.notice{border-left-color:var(--notice)}
.alert h4{margin:0;font-size:15px}
.steps{display:flex;gap:4px;font-size:12px;flex-wrap:wrap}
.steps span{padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.steps span.on{background:var(--accent-soft);border-color:var(--accent);color:var(--fg);font-weight:700}
.log{font-size:12px;color:var(--mute);margin:0;padding-left:16px}
.empty{color:var(--mute);padding:14px;border:1px dashed var(--line);border-radius:8px;font-size:14px}
.stepper{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.stepper span{padding:3px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--mute)}
.stepper span.on{background:var(--accent-soft);border-color:var(--accent);color:var(--fg);font-weight:700}
.foot{margin-top:28px;font-size:12px;color:var(--mute);border-top:1px solid var(--line);padding-top:12px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:14px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
</style>

<div class="wrap">
<header class="top">
  <div>
    <h1>一動五通</h1>
    <p>面向五個身分的數據分析與追蹤通報・居家運動照護協作系統</p>
  </div>
  <div class="row"><span class="tag">模擬資料</span><span class="tag">虛構個案：林阿嬤，78 歲，手搖機</span></div>
</header>

<section class="sim" aria-label="模擬器材資料">
  <h2>模擬今天的器材資料（選一個情境，系統立即處理）</h2>
  <div class="scn" id="scn"></div>
  <p class="simnote" id="scnNote"></p>
</section>

<nav class="tabs" id="tabs" role="tablist" aria-label="畫面切換"></nav>
<main id="view"></main>

<p class="foot">本系統為競賽概念原型，使用虛構資料。運動與生理數據用於記錄與溝通，不取代診斷或專業人員判斷。警示門檻由醫護依個人設定，此處的數值僅供示範。補助、核銷或給付項目，須依主管機關最新規定確認。</p>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
/* ---------- constants ---------- */
const ROLES=[["pipe","資料流程"],["elder","長輩"],["family","家屬"],["care","居服員"],["coach","教練"],["med","醫護"]];
const ROLE_NAME={elder:"長輩",family:"家屬",care:"居服員",coach:"教練",med:"醫護"};
const WD="日一二三四五六";
const ST=["已送出","已收到","已確認","已處理"];
const PAST={ // off: min,hrAvg,hrMax,cad,res,pw,sbp,dbp,sp1,sp2 ; null = no exercise
 13:[18,96,112,42,3,22,138,82,97,96],12:null,11:[20,98,115,44,3,24,136,80,97,96],10:[22,99,118,45,3,25,140,84,96,96],
 9:null,8:[22,100,119,46,4,28,142,84,97,96],7:[24,101,120,46,4,29,139,81,97,97],6:[25,102,122,47,4,30,137,80,97,96],
 5:null,4:[25,103,121,48,4,31,141,83,96,96],3:[26,103,123,48,4,32,138,82,97,97],2:[27,104,124,49,4,33,140,82,97,96],1:[28,104,125,50,4,34,139,81,97,97]};
const SCN={
 normal:{name:"一般運動日",desc:"30 分鐘中等強度，數值都在平常範圍",n:30,hrAvg:105,hrMax:126,cad:50,res:4,bp:[138,82],sp:[97,97]},
 hr:{name:"心率過高",desc:"運動中最高心率超過醫護設定的上限",n:24,hrAvg:128,hrMax:149,cad:54,res:5,bp:[142,84],sp:[97,95]},
 bp:{name:"運動前血壓偏高",desc:"運動前量到 168/96，建議暫緩運動",n:0,bp:[168,96],sp:[97,null]},
 miss:{name:"連續未運動",desc:"已經 3 天沒有運動紀錄",n:0,missPast:3},
 bt:{name:"藍牙斷線",desc:"中途 4 分鐘沒有資料，另有 1 筆感測跳動",n:30,hrAvg:105,hrMax:126,cad:50,res:4,gap:[14,18],spike:6,bp:[136,80],sp:[97,97]}
};

/* ---------- state ---------- */
const S={scn:"normal",role:"pipe",pstep:0,hist:[],series:[],clean:null,rules:[],alerts:[],svc:[],coachLog:[],
  thr:{hr:135,sbp:160,dbp:100,spo2:92,miss:3},share:{min:true,hr:true,bp:true},cheers:0,obs:"",obsChips:[],elderDone:false,aid:0};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
const sd=a=>{const m=mean(a);return Math.sqrt(mean(a.map(v=>(v-m)**2)))};
const dateOf=off=>{const d=new Date(2026,10,10-off);return {md:(d.getMonth()+1)+"/"+d.getDate(),wd:WD[d.getDay()]}};
const nowT=()=>{const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const mets=pw=>Math.round((1.5+pw/12)*10)/10;
const intensity=pw=>{const m=mets(pw);return m<3?["輕度",1]:m<5?["中等",2]:["較強",3]};
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),1800)}
function copy(text){
  const fb=()=>{const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("已複製")}catch(e){toast("請手動選取複製")}ta.remove()};
  try{navigator.clipboard.writeText(text).then(()=>toast("已複製"),fb)}catch(e){fb()}
}

/* ---------- data pipeline ---------- */
function genSeries(c){
  const out=[],peak=Math.round(c.n*0.7);
  for(let t=0;t<c.n;t++){
    let hr=Math.round(78+(c.hrAvg+3-78)*(1-Math.exp(-t/3))+Math.sin(t*1.3)*2.5);
    if(hr>=c.hrMax)hr=c.hrMax-2; if(t===peak)hr=c.hrMax;
    const cad=Math.round(c.cad+Math.cos(t*0.8)*2);
    const row={t:t+1,hr,cad,res:c.res,pw:Math.round(cad*c.res*0.17)};
    if(c.gap&&t>=c.gap[0]&&t<c.gap[1]){row.hr=null;row.cad=null;row.pw=null}
    if(c.spike===t)row.hr=214;
    out.push(row);
  }
  return out;
}
function process(){
  const c=SCN[S.scn],hist=[];
  for(let off=13;off>=1;off--){
    const p=PAST[off],miss=c.missPast&&off<=c.missPast;
    if(!p||miss)hist.push({off,none:true,min:0,...dateOf(off)});
    else hist.push({off,min:p[0],hrAvg:p[1],hrMax:p[2],cad:p[3],res:p[4],pw:p[5],sbp:p[6],dbp:p[7],sp1:p[8],sp2:p[9],kj:Math.round(p[5]*p[0]*60/100)/10,...dateOf(off)});
  }
  S.series=c.n?genSeries(c):[];
  const raw=S.series,valid=raw.filter(r=>r.hr!=null&&r.hr>=30&&r.hr<=200);
  const gaps=raw.filter(r=>r.hr==null).length,spikes=raw.filter(r=>r.hr!=null&&r.hr>200).length;
  S.clean={total:raw.length,valid:valid.length,gaps,spikes};
  const today={off:0,none:!c.n,min:c.n,...dateOf(0)};
  if(c.n){
    today.hrAvg=Math.round(mean(valid.map(r=>r.hr)));today.hrMax=Math.max(...valid.map(r=>r.hr));
    today.cad=Math.round(mean(valid.map(r=>r.cad)));today.res=c.res;today.pw=Math.round(mean(valid.map(r=>r.pw)));
    today.kj=Math.round(valid.reduce((s,r)=>s+r.pw*60,0)/100)/10;
  }
  if(c.bp){today.sbp=c.bp[0];today.dbp=c.bp[1];today.sp1=c.sp[0];today.sp2=c.sp[1]}
  hist.push(today);S.hist=hist;
  S.elderDone=false;S.obs="";S.obsChips=[];
  evaluate();
}
function streak(){let n=0;for(let i=S.hist.length-1;i>=0&&S.hist[i].min===0;i--)n++;return n}
function evaluate(){
  const T=S.thr,t=S.hist[S.hist.length-1],past=S.hist.filter(r=>r.min>0&&r.off>0).slice(-7),R=[];
  const hasEx=t.min>0;
  if(hasEx){
    R.push({id:"hr",name:"運動中最高心率",value:t.hrMax+" 次/分",limit:"≤ "+T.hr,lvl:t.hrMax>T.hr?"crit":"ok"});
    const m=mean(past.map(r=>r.hrAvg)),s=sd(past.map(r=>r.hrAvg)),lim=Math.round(m+2*s);
    R.push({id:"base",name:"平均心率對照個人基準",value:t.hrAvg+" 次/分",limit:"近 7 次平均 "+Math.round(m)+"，上緣 "+lim,lvl:t.hrAvg>lim?"notice":"ok",lim});
  }else{
    R.push({id:"hr",name:"運動中最高心率",value:"今天沒有運動資料",limit:"≤ "+T.hr,lvl:"na"});
    R.push({id:"base",name:"平均心率對照個人基準",value:"今天沒有運動資料",limit:"—",lvl:"na"});
  }
  if(t.sbp)R.push({id:"bp",name:"運動前血壓",value:t.sbp+"/"+t.dbp+" mmHg",limit:"收縮壓 ≤ "+T.sbp+"、舒張壓 ≤ "+T.dbp,lvl:(t.sbp>T.sbp||t.dbp>T.dbp)?"warn":"ok"});
  else R.push({id:"bp",name:"運動前血壓",value:"未量測",limit:"—",lvl:"na"});
  if(t.sp2!=null)R.push({id:"sp",name:"運動後血氧",value:t.sp2+" %",limit:"≥ "+T.spo2,lvl:t.sp2<T.spo2?"crit":"ok"});
  else R.push({id:"sp",name:"運動後血氧",value:"未量測",limit:"—",lvl:"na"});
  const st=streak();

  if(g("miss").lvl==="warn")mk("miss","warn","連續 "+st+" 天未運動","最近 "+st+" 天沒有運動紀錄。","阿嬤已經 "+st+" 天沒運動，可以打個電話鼓勵她。",["family","care","coach"],"電話或到府關心原因（身體不適、設備、情緒），並留下紀錄。");
  if(g("base").lvl==="notice")mk("base","notice","心率高於個人平常","平均心率 "+t.hrAvg+"，高於個人基準上緣 "+g("base").lim+"。","阿嬤今天運動時心跳比平常稍快。",["coach","med"],"回診前請醫護確認；教練暫緩加量。");

}

/* ---------- chart helpers ---------- */
function lineChart(o){
  const W=640,H=o.h||180,pl=34,pr=10,pt=10,pb=22,n=o.n;
  const x=i=>pl+(W-pl-pr)*(n<=1?0:i/(n-1)),y=v=>pt+(H-pt-pb)*(1-(v-o.min)/(o.max-o.min));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label)}">`;
  o.ticks.forEach(t=>{s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}"/><text class="tick" x="${pl-6}" y="${y(t)+4}" text-anchor="end">${t}</text>`});
  if(o.band)s+=`<rect class="band" x="${pl}" width="${W-pl-pr}" y="${y(o.band[1])}" height="${y(o.band[0])-y(o.band[1])}" opacity=".7"/>`;
  if(o.thr!=null)s+=`<line class="thr" x1="${pl}" x2="${W-pr}" y1="${y(o.thr)}" y2="${y(o.thr)}"/><text class="thrt" x="${W-pr}" y="${y(o.thr)-4}" text-anchor="end">${esc(o.thrLabel||"")}</text>`;
  o.series.forEach(se=>{
    let d="",pen=false,last=null;
    se.v.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)+" ";pen=true;last=[x(i),y(v)]});
    s+=`<path class="ln ${se.c}" d="${d}"/>`;
    if(last)s+=`<circle class="dot ${se.c}" cx="${last[0]}" cy="${last[1]}" r="4" style="stroke:inherit"/>`;
  });
  (o.xl||[]).forEach((l,i)=>{if(l)s+=`<text class="tick" x="${x(i)}" y="${H-6}" text-anchor="middle">${esc(l)}</text>`});
  return s+"</svg>";
}
function barChart(vals,labels,max,unit){
  const W=640,H=170,pl=34,pr=10,pt=14,pb=22,n=vals.length,bw=(W-pl-pr)/n;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="近 14 天每日運動分鐘">`;
  [0,max/2,max].forEach(t=>{const yy=pt+(H-pt-pb)*(1-t/max);s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}"/><text class="tick" x="${pl-6}" y="${yy+4}" text-anchor="end">${t}</text>`});
  vals.forEach((v,i)=>{const h=(H-pt-pb)*v/max,xx=pl+i*bw+bw*0.18;
    s+=`<rect class="bar${i===n-1?" today":""}" x="${xx}" y="${H-pb-h}" width="${bw*0.64}" height="${h}" rx="3"/>`;
    if(v>0)s+=`<text class="tick" x="${xx+bw*0.32}" y="${H-pb-h-3}" text-anchor="middle">${v}</text>`;
    if(i%2===(n-1)%2)s+=`<text class="tick" x="${xx+bw*0.32}" y="${H-6}" text-anchor="middle">${labels[i]}</text>`});
  return s+"</svg>";
}

    ${mine.length?`<div style="display:grid;gap:10px">${mine.map(a=>alertCard(a,"care")).join("")}</div>`:`<p class="empty">沒有待處理的事項。選擇上方「心率過高」或「連續未運動」情境，看看警示怎麼送到這裡。</p>`}</section></div>`;
}

function vCoach(){
  const H=S.hist,vals=H.map(r=>r.min),labels=H.map(r=>r.md);
  const wk=(a,b)=>H.slice(a,b),cnt=r=>r.filter(x=>x.min>0).length;
  const thisW=wk(7,14),lastW=wk(0,7);
  const pwAvg=r=>{const s=r.filter(x=>x.min>0);return s.length?mean(s.map(x=>x.pw)):0};
  const dPw=Math.round(pwAvg(thisW)-pwAvg(lastW));
  const blocked=S.alerts.some(a=>a.lvl==="crit"||a.lvl==="warn");
  const sug=blocked?["暫不調整","目前有安全或連續未運動提醒，先不加量，等醫護或居服員回覆。"]:cnt(thisW)>=4&&dPw>0?["可小幅加量","本週運動 "+cnt(thisW)+" 次，平均功率比上週高 "+dPw+" W，可考慮阻力加 1 級（建議，由教練決定）。"]:["維持目前課表","頻率與強度穩定，維持目前阻力與時間。"];
  const hrs=H.map(r=>r.min>0?r.hrAvg:null);
  return `<div class="grid2">
   <section class="card"><h3>近 14 天運動頻率</h3>${barChart(vals,labels,40)}
    <div class="row" style="margin-top:8px;gap:20px"><span>本週 <b class="num">${cnt(thisW)}</b> 次／<b class="num">${thisW.reduce((s,r)=>s+r.min,0)}</b> 分</span><span class="mute">上週 <span class="num">${cnt(lastW)}</span> 次／<span class="num">${lastW.reduce((s,r)=>s+r.min,0)}</span> 分</span></div></section>
   <section class="card"><h3>強度與進步（對照自己）</h3>
    ${lineChart({label:"近 14 天平均心率",n:H.length,min:90,max:140,ticks:[90,110,130],h:170,series:[{c:"c-b",v:hrs}],xl:labels.map((l,i)=>i%3===0?l:"")})}
    <div class="legend"><span><i style="background:var(--notice)"></i>每日平均心率（次/分）</span></div>
    <p style="margin:8px 0 0;font-size:14px">平均功率：本週 <b class="num">${Math.round(pwAvg(thisW))}</b> W，上週 <b class="num">${Math.round(pwAvg(lastW))}</b> W（${dPw>=0?"+":""}${dPw}）。運動強度為估計值，約 ${mets(pwAvg(thisW))} METs。</p></section>
   <section class="card"><h3>課表調整建議</h3><p class="status-line" style="margin:0 0 6px">${sug[0]}</p><p style="margin:0 0 12px">${sug[1]}</p>
    <div class="row"><button class="btn pri" data-act="coach" data-v="採納：${sug[0]}">採納建議</button><button class="btn" data-act="coach" data-v="保留：維持原課表，另行評估">先保留</button></div>
    ${S.coachLog.length?`<ul class="log" style="margin-top:10px">${S.coachLog.map(l=>`<li>${l.t} ${esc(l.x)}</li>`).join("")}</ul>`:""}</section>
   <section class="card"><h3>給教練的提醒</h3>${alertsFor("coach").length?`<div style="display:grid;gap:10px">${alertsFor("coach").map(a=>alertCard(a,"coach")).join("")}</div>`:`<p class="empty">目前沒有提醒。</p>`}</section></div>`;
}

function vMed(){
  const H=S.hist.filter(r=>r.min>0||r.sbp),T=S.thr,ex=S.hist.filter(r=>r.min>0);
  const past=S.hist.filter(r=>r.min>0&&r.off>0).slice(-7),m=mean(past.map(r=>r.hrAvg)),s=sd(past.map(r=>r.hrAvg));
  const full=S.hist,nm=(id,l,v,st)=>`<label>${l}<br><input type="number" id="${id}" data-act="thr" data-k="${v}" value="${T[v]}" step="${st||1}"></label>`;
  return `<div class="grid2">
   <section class="card"><h3>心率趨勢</h3><p class="lead">綠色帶是個人近 7 次平均 ±2 個標準差；紅色虛線是醫護設定的上限。</p>
    ${lineChart({label:"近 14 天心率",n:full.length,min:80,max:160,ticks:[80,100,120,140,160],band:[Math.round(m-2*s),Math.round(m+2*s)],thr:T.hr,thrLabel:"上限 "+T.hr,h:200,
      series:[{c:"c-a",v:full.map(r=>r.min>0?r.hrAvg:null)},{c:"c-w",v:full.map(r=>r.min>0?r.hrMax:null)}],xl:full.map((r,i)=>i%3===0?r.md:"")})}
    <div class="legend"><span><i style="background:var(--accent)"></i>平均心率</span><span><i style="background:var(--warn)"></i>最高心率</span></div></section>
   <section class="card"><h3>警示門檻（由醫護個別設定）</h3><p class="lead">修改後，系統會用新門檻重新判斷今天的資料，警示紀錄會重新產生。</p>
    <div class="row" style="gap:16px;align-items:flex-end">${nm("t1","最高心率上限","hr")}${nm("t2","收縮壓上限","sbp")}${nm("t3","舒張壓上限","dbp")}${nm("t4","血氧下限 %","spo2")}${nm("t5","連續未運動天數","miss")}</div></section>
  </div>
  <section class="card"><h3>運動與生理紀錄（近 14 天）</h3><div class="scroll"><table><thead><tr><th>日期</th><th class="r">分鐘</th><th class="r">平均心率</th><th class="r">最高心率</th><th class="r">踏頻</th><th class="r">阻力</th><th class="r">功率 W</th><th class="r">作功 kJ</th><th class="r">METs（估）</th><th class="r">運動前血壓</th><th class="r">血氧 前/後</th></tr></thead><tbody>
   ${full.slice().reverse().map(r=>`<tr class="${r.off===0?"today":""}"><td>${r.md}（${r.wd}）</td>${r.min>0?`<td class="r num">${r.min}</td><td class="r num">${r.hrAvg}</td><td class="r num">${r.hrMax}</td><td class="r num">${r.cad}</td><td class="r num">${r.res}</td><td class="r num">${r.pw}</td><td class="r num">${r.kj}</td><td class="r num">${mets(r.pw)}</td>`:`<td class="r mute" colspan="8">未運動</td>`}<td class="r num">${r.sbp?r.sbp+"/"+r.dbp:"—"}</td><td class="r num">${r.sp1?r.sp1+" / "+(r.sp2||"—"):"—"}</td></tr>`).join("")}</tbody></table></div>
   <div class="row" style="margin-top:10px"><button class="btn" data-act="copyMed">複製回診摘要</button><span class="mute" style="font-size:13px">摘要為純文字，可貼到病歷或 PDF 文件。</span></div></section>
  <section class="card"><h3>異常事件與處理紀錄</h3>${S.alerts.length?`<div style="display:grid;gap:10px">${S.alerts.map(a=>alertCard(a,"med")).join("")}</div>`:`<p class="empty">今天沒有異常事件。</p>`}</section>`;
}

/* ---------- render ---------- */
function renderScn(){
  $("#scn").innerHTML=Object.entries(SCN).map(([k,v])=>`<button data-act="scn" data-k="${k}" aria-pressed="${k===S.scn}"><b>${v.name}</b><span>${v.desc}</span></button>`).join("");
  $("#scnNote").textContent="選擇後，下方每個角色的畫面會同步更新。可以切換分頁看同一筆資料的不同說法。";
}
function renderTabs(){
  $("#tabs").innerHTML=ROLES.map(([k,l])=>{
    const n=k==="pipe"?0:alertsFor(k).filter(a=>a.status<3&&a.lvl!=="notice").length;
    return `<button role="tab" data-act="tab" data-k="${k}" aria-selected="${k===S.role}">${l}${n?`<span class="badge" aria-label="${n} 則提醒">${n}</span>`:""}</button>`}).join("");
}
function render(){
  const keepTA=document.activeElement&&document.activeElement.id==="obs";
  renderTabs();
  const f={pipe:vPipe,elder:vElder,family:vFamily,care:vCare,coach:vCoach,med:vMed}[S.role];
  $("#view").innerHTML=f();
  if(keepTA){const e=$("#obs");if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}}
}

/* ---------- events ---------- */
function logTo(a,who,x){a.log.push({t:nowT(),who,x})}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b||b.tagName==="INPUT"&&b.type!=="checkbox")return;
  const act=b.dataset.act;
  if(act==="scn"){S.scn=b.dataset.k;S.pstep=0;process();S.role="pipe";renderScn();render();
    document.querySelectorAll(".flow button").forEach((el,i)=>{el.style.animationDelay=i*120+"ms";el.classList.add("pulse")});toast("已接收並處理今天的資料");}
  else if(act==="tab"){S.role=b.dataset.k;render()}
  else if(act==="pstep"){S.pstep=+b.dataset.i;render()}
  else if(act==="adv"){const a=S.alerts.find(x=>x.id==+b.dataset.id);if(!a||a.status>=3)return;a.status++;
    const who=ROLE_NAME[b.dataset.role],x=["","已收到提醒","已確認，已聯絡長輩並了解狀況","已處理完成，結果記入服務紀錄"][a.status];logTo(a,who,x);render();toast("狀態：「"+ST[a.status]+"」")}
  else if(act==="famAck"){const a=S.alerts.find(x=>x.id==+b.dataset.id);logTo(a,"家屬","已知悉，會打電話關心");render();toast("已記錄")}
  else if(act==="help"){const a={id:++S.aid,key:"help",lvl:"crit",title:"長輩按下求助",detail:"長輩按下「我不舒服，需要幫忙」。",fam:"阿嬤按了求助鈕，請盡快聯絡她。",to:["family","care","med"],advice:"立即電話聯絡長輩；必要時聯絡緊急醫療。",status:0,log:[]};
    logTo(a,"系統","求助訊號已送出給：家屬、居服員、醫護");S.alerts.unshift(a);render();toast("已通知家人與居服員")}
  else if(act==="elderOk"){S.elderDone=true;const a=elderTop();if(a&&a.lvl==="crit"){logTo(a,"長輩","回報：已坐下休息")}render();toast(S.scn==="miss"?"請握好手搖機，慢慢開始":"好的")}
  else if(act==="cheer"){S.cheers++;render();toast("已送出鼓勵")}
  else if(act==="chip"){const v=b.dataset.v,i=S.obsChips.indexOf(v);i>=0?S.obsChips.splice(i,1):S.obsChips.push(v);render()}
  else if(act==="svc"){const t=lastRow(),o=[...S.obsChips,S.obs.trim()].filter(Boolean).join("；")||"（未填寫）";
    S.svc.unshift({d:t.md+"（週"+t.wd+"）",min:t.min,o,by:"居服員"});S.obs="";S.obsChips=[];render();toast("已存入服務紀錄")}
  else if(act==="copySvc"){copy(["日期\t運動分鐘\t觀察\t人員",...S.svc.map(r=>[r.d,r.min,r.o,r.by].join("\t"))].join("\n"))}
  else if(act==="coach"){S.coachLog.unshift({t:nowT(),x:b.dataset.v});render();toast("已記錄")}
  else if(act==="copyMed"){const r=lastRow(),f=S.rules.filter(x=>x.lvl!=="ok"&&x.lvl!=="na");
    copy("林阿嬤（虛構個案）回診摘要\n日期：2026-11-10\n今日："+(r.min>0?`運動 ${r.min} 分鐘，平均心率 ${r.hrAvg}、最高 ${r.hrMax}，作功 ${r.kj} kJ`:"未運動")+(r.sbp?`，運動前血壓 ${r.sbp}/${r.dbp}`:"")+"\n異常："+(f.length?f.map(x=>x.name+"："+x.value).join("；"):"無")+"\n（數據僅供記錄與溝通，不取代專業判斷）")}
});
document.addEventListener("input",e=>{
  if(e.target.id==="obs"){S.obs=e.target.value}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.act==="share"){S.share[t.dataset.k]=t.checked;render()}
  else if(t.dataset.act==="thr"){const v=parseFloat(t.value);if(!isNaN(v)){S.thr[t.dataset.k]=v;evaluate();render();toast("已用新門檻重新判斷")}}
});

process();renderScn();render();
})();
</script>

</body></html>
